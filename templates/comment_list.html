{{define "comment_list.html"}}
<div id="comment-list" class="space-y-3">
    {{if .}}
        {{range .}}
        <div class="bg-[#0e0922]/80 border border-violet-500/20 rounded-xl p-3.5 space-y-1.5 shadow-md">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <div class="flex items-center gap-2 font-medium text-slate-200">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-violet-600 to-cyan-500 p-0.5 shadow-sm">
                        <div class="w-full h-full bg-[#0d091e] rounded-full text-cyan-300 text-[10px] font-bold flex items-center justify-center">
                            {{slice .Author 0 1}}
                        </div>
                    </div>
                    <span class="text-cyan-300 font-semibold">{{.Author}}</span>
                </div>
                <span class="text-slate-400 text-[11px]"><i class="fa-regular fa-clock mr-1 text-violet-400"></i>{{.FormattedTime}}</span>
            </div>
            <p class="text-xs text-slate-300 pl-8 leading-relaxed">{{.Content}}</p>
        </div>
        {{end}}
    {{else}}
        <div class="text-center py-6 text-slate-500 text-xs italic bg-violet-950/10 rounded-xl border border-dashed border-violet-500/20">
            No comments yet. Start the conversation!
        </div>
    {{end}}
</div>
{{end}}
