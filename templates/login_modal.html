{{define "login_modal.html"}}
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-opacity animate-fadeIn" id="login-modal">
    <!-- Click backdrop to close -->
    <div class="fixed inset-0" onclick="closeModal()"></div>

    <!-- Modal Box -->
    <div class="relative bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl z-10 overflow-hidden text-slate-200">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
            <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-indigo-400"></i> Admin JWT Authentication
            </h3>
            <button class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 flex items-center justify-center transition-colors"
                    onclick="closeModal()">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form hx-post="/login"
              hx-target="#login-error-container"
              hx-swap="innerHTML"
              class="p-6 space-y-4">

            <div class="text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                <p><i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i> Log in as Admin to manage tickets, update status, and delete records.</p>
                <p class="font-mono text-slate-300">Default: <strong>admin</strong> / <strong>admin123</strong></p>
            </div>

            <!-- Error message container -->
            <div id="login-error-container"></div>

            <!-- Username -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" required value="admin" placeholder="admin"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:ring-1 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" required value="admin123" placeholder="••••••••"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:ring-1 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Footer Actions -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-xl transition-colors">
                    Cancel
                </button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-xs"></i> Log In
                </button>
            </div>
        </form>

    </div>
</div>
{{end}}
