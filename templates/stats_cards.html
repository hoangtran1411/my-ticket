{{define "stats_cards.html"}}
<div id="stats-container" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
    <!-- Total Tickets -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 hover:border-slate-700 transition-all shadow-lg backdrop-blur-md">
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center text-xl shrink-0">
            <i class="fa-solid fa-list-check"></i>
        </div>
        <div>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Tickets</p>
            <h3 class="text-2xl font-bold text-slate-100 mt-0.5">{{.Total}}</h3>
        </div>
    </div>

    <!-- In Progress -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 hover:border-slate-700 transition-all shadow-lg backdrop-blur-md">
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-xl shrink-0">
            <i class="fa-solid fa-spinner animate-spin-slow"></i>
        </div>
        <div>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">In Progress</p>
            <h3 class="text-2xl font-bold text-amber-400 mt-0.5">{{.InProgress}}</h3>
        </div>
    </div>

    <!-- Urgent / Critical -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 hover:border-slate-700 transition-all shadow-lg backdrop-blur-md">
        <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center text-xl shrink-0">
            <i class="fa-solid fa-fire"></i>
        </div>
        <div>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Urgent Bugs</p>
            <h3 class="text-2xl font-bold text-rose-400 mt-0.5">{{.UrgentCount}}</h3>
        </div>
    </div>

    <!-- Completion Rate -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 hover:border-slate-700 transition-all shadow-lg backdrop-blur-md">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl shrink-0">
            <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Done Ratio</p>
            <h3 class="text-2xl font-bold text-emerald-400 mt-0.5">{{.CompletionRate}}%</h3>
        </div>
    </div>
</div>
{{end}}
