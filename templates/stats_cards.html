{{define "stats_cards.html"}}
<div id="stats-container" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
    <!-- Total Tickets -->
    <div class="glass-panel glass-panel-hover rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden group">
        <div class="w-12 h-12 rounded-xl bg-violet-500/15 border border-violet-500/30 text-violet-300 flex items-center justify-center text-xl shrink-0 shadow-lg shadow-violet-500/20 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-list-check"></i>
        </div>
        <div>
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Total Tickets</p>
            <h3 class="text-2xl font-bold text-slate-100 mt-0.5 tracking-tight">{{.Total}}</h3>
        </div>
    </div>

    <!-- In Progress -->
    <div class="glass-panel glass-panel-hover rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden group">
        <div class="w-12 h-12 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 flex items-center justify-center text-xl shrink-0 shadow-lg shadow-amber-500/20 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-spinner animate-spin-slow"></i>
        </div>
        <div>
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">In Progress</p>
            <h3 class="text-2xl font-bold text-amber-300 mt-0.5 tracking-tight">{{.InProgress}}</h3>
        </div>
    </div>

    <!-- Urgent / Critical -->
    <div class="glass-panel glass-panel-hover rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden group">
        <div class="w-12 h-12 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl shrink-0 shadow-lg shadow-rose-500/20 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-fire"></i>
        </div>
        <div>
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Urgent Bugs</p>
            <h3 class="text-2xl font-bold text-rose-400 mt-0.5 tracking-tight">{{.UrgentCount}}</h3>
        </div>
    </div>

    <!-- Completion Rate -->
    <div class="glass-panel glass-panel-hover rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden group">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 flex items-center justify-center text-xl shrink-0 shadow-lg shadow-emerald-500/20 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Done Ratio</p>
            <h3 class="text-2xl font-bold text-emerald-300 mt-0.5 tracking-tight">{{.CompletionRate}}%</h3>
        </div>
    </div>
</div>
{{end}}
