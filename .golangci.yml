version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true


linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - misspell
    - bodyclose
    - copyloopvar
  settings:
    govet:
      enable:
        - shadow
        - nilness
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 5
    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
