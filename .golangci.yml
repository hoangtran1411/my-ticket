version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    colored-line-number: stdout

linters-settings:
  govet:
    enable:
      - shadow
      - nilness
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 5
  misspell:
    locale: US

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - misspell
    - bodyclose
    - copyloopvar

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: ".*_test\\.go"
      linters:
        - goconst
        - errcheck
        - gocyclo
